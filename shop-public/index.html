<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Zerno</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f5f3f0; --card:#ffffff; --text:#1f2328; --muted:#7b8088; --line:#ebe7e2;
    --accent:#7a4a2b; --accent-soft:#f3e9e1; --ok:#2f9e44; --bad:#c92a2a; --photo:#ffffff;
    --r:18px; --tabh:64px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --bg:#141518; --card:#1d1f23; --text:#f1f3f5; --muted:#9aa0a6; --line:#2b2e33;
      --accent:#d4a276; --accent-soft:#3a2a1e; --photo:#25272b; }
  }
  :root[data-theme="dark"]{ --bg:#141518; --card:#1d1f23; --text:#f1f3f5; --muted:#9aa0a6; --line:#2b2e33;
      --accent:#d4a276; --accent-soft:#3a2a1e; --photo:#25272b; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
  body{padding-bottom:calc(var(--tabh) + 16px + env(safe-area-inset-bottom))}
  button{font:inherit}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px}

  header{padding:14px 0 6px;display:flex;align-items:center;gap:10px}
  .logo{font-weight:800;font-size:22px;letter-spacing:-.3px;flex:1}
  .logo span{color:var(--accent)}
  .lang{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
  .lang button{border:0;background:transparent;color:var(--muted);padding:8px 11px;font-size:13px;font-weight:700;cursor:pointer}
  .lang button.on{background:var(--text);color:var(--bg)}
  h1{font-size:22px;margin:10px 0 12px}

  .search{margin-top:8px;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:0 12px}
  .search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font:inherit;padding:12px 0}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
  .chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}

  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding-top:6px}
  @media (min-width:640px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
  .card{background:var(--card);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 18px rgba(0,0,0,.04);cursor:pointer}
  .ph{aspect-ratio:1/1;background:var(--photo);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line);overflow:hidden}
  .ph img{width:100%;height:100%;object-fit:cover}
  .noimg{font-size:40px;opacity:.35}
  .tag{position:absolute;left:8px;top:8px;font-size:11px;font-weight:600;padding:4px 8px;border-radius:8px;background:var(--card);color:var(--muted);box-shadow:0 1px 4px rgba(0,0,0,.12)}
  .tag.low{color:var(--accent)} .tag.out{color:var(--bad)}
  .card.out .ph img{filter:grayscale(1);opacity:.5}
  .info{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
  .cat{font-size:12px;color:var(--muted)}
  .name{font-weight:600;font-size:14.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto}
  .price{font-weight:800;font-size:17px;white-space:nowrap}
  .add{width:36px;height:36px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:22px;line-height:1;cursor:pointer;flex:none}
  .add:disabled{background:var(--line);color:var(--muted)}
  .step{display:flex;align-items:center;background:var(--accent-soft);border-radius:12px;height:36px;flex:none}
  .step button{width:32px;height:36px;border:0;background:transparent;color:var(--accent);font-size:20px;cursor:pointer}
  .step span{min-width:18px;text-align:center;font-weight:700;color:var(--accent)}
  .empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:56px 12px}
  .empty b{display:block;font-size:40px;margin-bottom:8px}
  .btn{display:block;width:100%;border:0;border-radius:16px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;padding:15px;cursor:pointer}
  .btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
  .btn:disabled{opacity:.6}

  .line{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;margin-bottom:10px}
  .line .thumb{width:64px;height:64px;border-radius:12px;overflow:hidden;background:var(--photo);display:grid;place-items:center;flex:none}
  .line .thumb img{width:100%;height:100%;object-fit:cover}
  .line .thumb .noimg{font-size:24px}
  .line .mid{flex:1;min-width:0}
  .line .mid .name{min-height:0;font-size:14px}
  .line .mid .price{font-size:15px;margin-top:4px}
  .total{display:flex;justify-content:space-between;align-items:baseline;margin:14px 2px 14px;font-size:16px}
  .total b{font-size:24px}
  .note{color:var(--muted);font-size:13px;text-align:center;margin-top:10px}

  .order{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10px}
  .order .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .order .code{font-weight:800}
  .pill{font-size:12px;font-weight:700;padding:5px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .pill.paid{background:rgba(47,158,68,.12);color:var(--ok)} .pill.shipped,.pill.delivered{background:rgba(25,113,194,.12);color:#1971c2}
  .pill.cancelled{background:rgba(201,42,42,.1);color:var(--bad)}
  .order ul{margin:0;padding:0;list-style:none;color:var(--muted);font-size:14px}
  .order li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
  .order .sum{display:flex;justify-content:space-between;margin-top:8px;padding-top:8px;border-top:1px solid var(--line);font-weight:700}
  .order .meta{font-size:12px;color:var(--muted);margin-top:6px}

  .ai textarea{width:100%;min-height:96px;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:12px;font:inherit;resize:vertical;outline:0}
  .hints{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 12px}
  .advice{background:var(--card);border-radius:16px;padding:14px;margin:14px 0 10px;white-space:pre-wrap;line-height:1.45}
  .advice:empty{display:none}
  .dots::after{content:'…';animation:d 1s steps(3,end) infinite}
  @keyframes d{0%{content:''}33%{content:'.'}66%{content:'..'}}

  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--tabh)}
  .tabs button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:600;cursor:pointer;position:relative}
  .tabs button i{font-style:normal;font-size:21px;line-height:1;filter:grayscale(1);opacity:.7}
  .tabs button.on{color:var(--accent)} .tabs button.on i{filter:none;opacity:1}
  .tabs b{position:absolute;top:7px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:#fff;font-size:11px;display:grid;place-items:center}
  .tabs b:empty{display:none}
  section.view{display:none} section.view.on{display:block}

  .veil{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:10}
  .sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;
    transform:translateY(100%);transition:transform .25s ease;z-index:11;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .open .veil{opacity:1;pointer-events:auto} .open .sheet{transform:none}
  .sheet .big{aspect-ratio:4/3;background:var(--photo);display:grid;place-items:center;overflow:hidden}
  .sheet .big img{width:100%;height:100%;object-fit:cover}
  .sheet .body{padding:16px 20px 0;max-width:760px;margin:0 auto}
  .sheet h2{margin:4px 0 8px;font-size:21px;line-height:1.25}
  .sheet p{margin:0 0 14px;color:var(--muted)}
  .sheet .stock{font-size:14px;font-weight:600;margin-bottom:16px}
  .sheet .act{display:flex;align-items:center;gap:12px}
  .sheet .act .price{font-size:24px;flex:1}
  .sheet .act .add{width:auto;padding:0 20px;height:48px;font-size:16px;font-weight:700;border-radius:14px}
  .sheet .act .step{height:48px;border-radius:14px}
  .sheet .act .step button{width:44px;height:48px;font-size:24px}
  .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:16px;cursor:pointer}
  .toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-80px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;transition:.25s;z-index:20;max-width:90vw;text-align:center}
  .toast.on{transform:translate(-50%,0)}
  .skel{background:linear-gradient(90deg,var(--card),var(--line),var(--card));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:var(--r);aspect-ratio:3/4}
  @keyframes sk{to{background-position:-200% 0}}

  /* админка */
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px;font-weight:700;cursor:pointer}
  .seg button.on{background:var(--text);color:var(--bg)}
  .aline{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px;margin-bottom:8px;cursor:pointer}
  .aline .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden;background:var(--photo);display:grid;place-items:center;flex:none}
  .aline .thumb img{width:100%;height:100%;object-fit:cover} .aline .thumb .noimg{font-size:22px}
  .aline .mid{flex:1;min-width:0} .aline .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .aline .s{font-size:13px;color:var(--muted);margin-top:3px}
  .aline .s .warn{color:var(--accent);font-weight:600}
  .form label{display:block;font-size:13px;color:var(--muted);margin:12px 0 5px}
  .form input,.form textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;outline:0}
  .form textarea{min-height:76px;resize:vertical}
  .form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .form details{margin-top:12px} .form summary{color:var(--muted);font-size:14px;cursor:pointer}
  .form .actions{display:flex;gap:10px;margin-top:16px}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(201,42,42,.35)}
  .photoEdit{position:relative}
  .photoEdit .up{position:absolute;right:12px;bottom:12px;border:0;border-radius:12px;background:rgba(0,0,0,.6);color:#fff;padding:10px 14px;font-weight:700;cursor:pointer}
  .ostat{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .ostat button{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer}
  .ostat button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
  .tabs .in.five{grid-template-columns:repeat(5,1fr)}
  .tabs button[hidden]{display:none}

  /* оформление */
  .co .box{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
  .co .box h3{margin:0 0 10px;font-size:15px}
  .co select,.co input,.co textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;outline:0}
  .co textarea{min-height:64px;resize:vertical}
  .co .fld{margin-top:10px}
  .co .promo{display:flex;gap:8px} .co .promo .btn{width:auto;padding:0 16px}
  .co .sumrow{display:flex;justify-content:space-between;padding:4px 0;color:var(--muted)}
  .co .sumrow.big{color:var(--text);font-weight:800;font-size:19px;border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
  .co .ok{color:var(--ok)}
  .order .pay{margin-top:10px}

  /* админка 2.0 */
  .chips.adm{padding-top:0;margin-bottom:10px}
  .chips.adm em,.cr .badge{font-style:normal;background:var(--accent);color:#fff;border-radius:9px;font-size:11px;font-weight:700;padding:1px 6px;margin-left:6px}
  .chips.adm em:empty{display:none}
  .chips.small{padding:0 0 10px} .chips.small .chip{padding:7px 12px;font-size:13px}
  .contact{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .mini{border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:10px;padding:7px 11px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:4px}
  .oact{display:flex;gap:8px;margin-top:10px}
  .oact .btn{padding:12px;font-size:15px;border-radius:13px}
  .oact .btn.small,.btn.small{width:auto;flex:none;padding:12px 14px;font-size:14px}
  .order.flash{animation:fl 1.6s ease}
  @keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:none}}
  .kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{background:var(--card);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
  .kpi span{font-size:12.5px;color:var(--muted)} .kpi b{font-size:21px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi i{font-style:normal;font-size:12px;color:var(--muted)}
  .box{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px}
  .box h3{margin:0 0 12px;font-size:15px}
  .bars{display:flex;align-items:flex-end;gap:3px;height:120px;border-bottom:1px solid var(--line)}
  .bars.dense{gap:1px}
  .bar{flex:1;height:100%;display:flex;align-items:flex-end;cursor:pointer;min-width:0}
  .bar i{display:block;width:100%;background:var(--accent);border-radius:4px 4px 0 0;opacity:.85}
  .axis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:6px}
  .hbar{margin-bottom:10px} .hbar .hl{display:flex;justify-content:space-between;gap:10px;font-size:14px}
  .hbar .hl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hbar .ht{height:6px;background:var(--bg);border-radius:3px;margin:5px 0 2px;overflow:hidden} .hbar .ht i{display:block;height:100%;background:var(--accent);border-radius:3px}
  .hbar small{color:var(--muted);font-size:12px}
  .ava{width:44px;height:44px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
  .cr{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none} .cr small{color:var(--muted);font-size:11.5px}
  .chathead{display:flex;align-items:center;gap:10px;margin-bottom:10px} .chathead b{font-size:17px}
  .msgs{display:flex;flex-direction:column;gap:6px;padding-bottom:80px}
  .msg{max-width:82%;background:var(--card);border-radius:16px 16px 16px 4px;padding:8px 12px;white-space:pre-wrap;word-wrap:break-word;align-self:flex-start}
  .msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-radius:16px 16px 4px 16px}
  .msg small{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
  .msg img{display:block;max-width:100%;border-radius:12px;margin:-2px 0 4px}
  .composer{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));z-index:7;display:flex;gap:8px;padding:8px 16px;background:var(--bg);border-top:1px solid var(--line);max-width:760px;margin:0 auto}
  .composer textarea{flex:1;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:18px;padding:10px 14px;font:inherit;resize:none;outline:0;max-height:140px}
  .composer .btn{width:46px;height:42px;padding:0;border-radius:50%;flex:none;align-self:flex-end}
  .crow,.prow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .crow input{padding:9px 10px} .crow .cn{flex:2;min-width:0} .crow .cp{flex:none;width:78px}
  .crow .rub{color:var(--muted);font-size:14px;margin-left:-4px}
  .crow.off .cn,.crow.off .cp,.prow.off .mid{opacity:.45}
  .prow .mid{flex:1;min-width:0} .prow .s{font-size:12.5px;color:var(--muted);margin-top:2px}
  .sw{position:relative;display:inline-block;width:44px;height:26px;flex:none}
  .sw input{opacity:0;width:0;height:0;position:absolute}
  .sw i{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:.2s;cursor:pointer}
  .sw i::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
  .sw input:checked+i{background:var(--ok)} .sw input:checked+i::after{transform:translateX(18px)}
  .form .line2{display:flex;justify-content:space-between;align-items:center;color:var(--text);font-size:15px;margin:16px 0 8px}
  .two3{display:grid;grid-template-columns:1.6fr .8fr 1fr;gap:8px;margin-top:6px}
  .form .two3 input,.form .crow input{width:100%}
  /* трекер заказа у покупателя */
  .steps{display:flex;align-items:flex-start;margin:4px 0 12px}
  .steps div{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative}
  .steps div::before{content:'';display:block;width:14px;height:14px;border-radius:50%;background:var(--line);margin:0 auto 5px;position:relative;z-index:1}
  .steps div::after{content:'';position:absolute;top:6px;left:-50%;width:100%;height:2px;background:var(--line)}
  .steps div:first-child::after{display:none}
  .steps div.done::before,.steps div.done::after,.steps div.now::after{background:var(--ok)}
  .steps div.now::before{background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
  .steps div.now{color:var(--text);font-weight:700}
  .pill.assembling{background:var(--accent-soft);color:var(--accent)}
  .track{margin-top:8px;font-size:14px} .stars{margin-top:6px;color:#f59f00;letter-spacing:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Zer<span>no</span> ☕</div>
    <div class="lang" id="lang"><button data-lang="ru">RU</button><button data-lang="en">EN</button></div>
  </header>

  <section class="view on" id="v-catalog">
    <label class="search">🔍<input id="q" type="search" autocomplete="off"></label>
    <div class="chips" id="chips"></div>
    <main class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></main>
  </section>

  <section class="view" id="v-cart"></section>
  <section class="view" id="v-orders"></section>
  <section class="view co" id="v-checkout"></section>

  <section class="view" id="v-admin"></section>

  <section class="view ai" id="v-ai">
    <h1 id="aiTitle"></h1>
    <textarea id="aiQ"></textarea>
    <div class="hints" id="aiHints"></div>
    <button class="btn" id="aiGo"></button>
    <div class="advice" id="aiAdvice"></div>
    <div class="grid" id="aiGrid"></div>
  </section>
</div>

<nav class="tabs"><div class="in" id="tabs">
  <button data-tab="catalog" class="on"><i>🏠</i><span data-t="tCatalog"></span></button>
  <button data-tab="cart"><i>🛒</i><span data-t="tCart"></span><b id="cartCount"></b></button>
  <button data-tab="orders"><i>📦</i><span data-t="tOrders"></span></button>
  <button data-tab="ai"><i>✨</i><span data-t="tAi"></span></button>
  <button data-tab="admin" id="adminTab" hidden><i>⚙️</i><span data-t="tAdmin"></span><b id="admBadge"></b></button>
</div></nav>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet"></section>
<div class="toast" id="toast"></div>
<input type="file" id="photoFile" accept="image/*" hidden>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = Boolean(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); document.documentElement.dataset.theme = tg.colorScheme === 'dark' ? 'dark' : 'light'; }

const T = {
  ru: { tCatalog: 'Каталог', tCart: 'Корзина', tOrders: 'Заказы', tAi: 'AI-подбор', tAdmin: 'Админка', all: 'Все', search: 'Поиск кофе и чая',
        inStock: n => `В наличии ${n} шт.`, low: n => `Осталось ${n}`, out: 'Нет в наличии', empty: 'Ничего не нашлось',
        checkout: s => `Оформить · ${s}`, noMore: 'Больше нет в наличии', addBtn: 'В корзину', total: 'Итого',
        err: 'Не получилось загрузить. Проверьте интернет и попробуйте ещё раз.', retry: 'Обновить',
        notTg: 'Откройте магазин из Telegram — кнопка «🛍 Магазин» в чате с ботом.',
        cartTitle: 'Корзина', cartEmpty: 'Корзина пока пуста', toCatalog: 'Перейти в каталог',
        checkoutNote: 'Оплата картой или СБП через ЮKassa — безопасно.',
        ordersTitle: 'Мои заказы', ordersEmpty: 'Заказов пока нет', delivery: 'Доставка',
        aiTitle: 'Подберём кофе', aiPh: 'Опишите комнату: площадь, где стоит, стиль, бюджет…', aiGo: 'Подобрать', aiWait: 'Подбираю',
        aiHints: ['Ванная 5 м², хром, до 10 000 ₽', 'Гостиная 25 м², белый, вертикальный', 'Лофт, чёрный, большой'], aiNone: 'Под запрос ничего не нашлось — попробуйте описать иначе' },
  en: { tCatalog: 'Catalog', tCart: 'Cart', tOrders: 'Orders', tAi: 'AI pick', tAdmin: 'Admin', all: 'All', search: 'Search coffee and tea',
        inStock: n => `In stock: ${n}`, low: n => `Only ${n} left`, out: 'Out of stock', empty: 'Nothing found',
        checkout: s => `Checkout · ${s}`, noMore: 'No more in stock', addBtn: 'Add to cart', total: 'Total',
        err: 'Could not load. Check your connection and try again.', retry: 'Retry',
        notTg: 'Open the shop from Telegram — the «🛍 Магазин» button in the bot chat.',
        cartTitle: 'Cart', cartEmpty: 'Your cart is empty', toCatalog: 'Go to catalog',
        checkoutNote: 'Pay by card or SBP via ЮKassa — secure.',
        ordersTitle: 'My orders', ordersEmpty: 'No orders yet', delivery: 'Delivery',
        aiTitle: 'Find your coffee', aiPh: 'Describe the room: size, placement, style, budget…', aiGo: 'Find', aiWait: 'Thinking',
        aiHints: ['Bathroom 5 m², chrome, under 10 000 ₽', 'Living room 25 m², white, vertical', 'Loft, black, large'], aiNone: 'Nothing matched — try describing it differently' },
};
let lang = 'ru', L = T.ru;
let products = [], cart = {}, cat = null, query = '', tab = 'catalog', orders = null;

const $ = id => document.getElementById(id);
const rub = k => Math.round(k / 100).toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nm = p => (lang === 'en' && p.name_en) || p.name;
const ds = p => (lang === 'en' && p.description_en) || p.description || '';
const ct = p => (lang === 'en' && p.category_en) || p.category || '';
const byId = id => products.find(x => x.id == id);
const when = s => { if (!s) return ''; const d = new Date(String(s).replace(' ', 'T') + 'Z'); return isNaN(d) ? '' : d.toLocaleString(lang === 'en' ? 'en-GB' : 'ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); };

async function api(path, body, tries = 3) {
  for (let i = 0; ; i++) {
    try {
      const r = await fetch('/shop-api' + path, {
        method: body ? 'POST' : 'GET',
        headers: { 'Content-Type': 'application/json', 'X-Init-Data': tg?.initData || '' },
        body: body ? JSON.stringify(body) : undefined,
      });
      const d = await r.json().catch(() => ({}));
      if (r.status === 401) { const e = new Error(L.notTg); e.fatal = true; throw e; }
      if (!r.ok) { const e = new Error(d.error || L.err); e.fatal = r.status < 500; throw e; }
      return d;
    } catch (e) {
      // сервер мог перезапускаться (обновление) — пробуем ещё пару раз
      if (e.fatal || i >= tries - 1) throw e;
      await new Promise(r => setTimeout(r, 1200 * (i + 1)));
    }
  }
}
function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.remove('on'), 1800); }
function haptic(kind) { try { tg?.HapticFeedback?.impactOccurred(kind || 'light'); } catch {} }

const NOIMG = `<div class="noimg">♨️</div>`;
const photo = p => p && p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy" onerror="this.outerHTML=NOIMG">` : NOIMG;

function applyLang() {
  L = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach(el => el.textContent = L[el.dataset.t]);
  document.querySelectorAll('#lang button').forEach(b => b.classList.toggle('on', b.dataset.lang === lang));
  $('q').placeholder = L.search;
  $('aiTitle').textContent = L.aiTitle; $('aiQ').placeholder = L.aiPh; $('aiGo').textContent = L.aiGo;
  $('aiHints').innerHTML = L.aiHints.map(h => `<button class="chip" data-hint="${esc(h)}">${esc(h)}</button>`).join('');
}

/* ---------- каталог ---------- */
function stockTag(p) {
  if (p.stock <= 0) return `<span class="tag out">${L.out}</span>`;
  if (p.stock <= 3) return `<span class="tag low">${L.low(p.stock)}</span>`;
  return '';
}
function ctrl(p) {
  const q = cart[p.id] || 0;
  if (p.stock <= 0) return `<button class="add" disabled>+</button>`;
  if (!q) return `<button class="add" data-add="${p.id}" aria-label="${L.addBtn}">+</button>`;
  return `<div class="step"><button data-dec="${p.id}">−</button><span>${q}</span><button data-add="${p.id}">+</button></div>`;
}
const cardHtml = p => `
  <article class="card ${p.stock <= 0 ? 'out' : ''}" data-open="${p.id}">
    <div class="ph">${photo(p)}${stockTag(p)}</div>
    <div class="info">
      ${ct(p) ? `<div class="cat">${esc(ct(p))}</div>` : ''}
      <div class="name">${esc(nm(p))}</div>
      <div class="row"><div class="price">${rub(p.price)}</div><div data-ctrl="${p.id}">${ctrl(p)}</div></div>
    </div>
  </article>`;
function renderChips() {
  const cats = [...new Map(products.filter(p => p.category).map(p => [p.category, ct(p)])).entries()];
  $('chips').innerHTML = [`<button class="chip ${cat === null ? 'on' : ''}" data-c="">${L.all}</button>`]
    .concat(cats.map(([k, v]) => `<button class="chip ${cat === k ? 'on' : ''}" data-c="${esc(k)}">${esc(v)}</button>`)).join('');
}
function renderGrid() {
  const q = query.trim().toLowerCase();
  const list = products.filter(p => (!cat || p.category === cat) &&
    (!q || [p.name, p.name_en, p.description, p.category, p.category_en].join(' ').toLowerCase().includes(q)));
  $('grid').innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty"><b>🔍</b>${L.empty}</div>`;
}

/* ---------- корзина ---------- */
function cartTotals() {
  let n = 0, sum = 0;
  for (const [id, q] of Object.entries(cart)) { const p = byId(id); if (p) { n += q; sum += q * p.price; } }
  return { n, sum };
}
function renderCart() {
  const { n, sum } = cartTotals();
  $('cartCount').textContent = n || '';
  const lines = Object.entries(cart).map(([id, q]) => ({ p: byId(id), q })).filter(x => x.p);
  $('v-cart').innerHTML = `<h1>${L.cartTitle}</h1>` + (lines.length ? lines.map(({ p, q }) => `
      <div class="line">
        <div class="thumb" data-open="${p.id}">${photo(p)}</div>
        <div class="mid"><div class="name">${esc(nm(p))}</div><div class="price">${rub(p.price * q)}</div></div>
        <div class="step"><button data-dec="${p.id}">−</button><span>${q}</span><button data-add="${p.id}">+</button></div>
      </div>`).join('') + `
      <div class="total"><span>${L.total}</span><b>${rub(sum)}</b></div>
      ${inTg ? '' : `<button class="btn" data-checkout>${L.checkout(rub(sum))}</button>`}
      <div class="note">${L.checkoutNote}</div>`
    : `<div class="empty"><b>🛒</b>${L.cartEmpty}<br><br><button class="btn ghost" data-tab="catalog">${L.toCatalog}</button></div>`);
  mainButton();
}
function mainButton() {
  if (!inTg || !tg.MainButton) return;
  const { n, sum } = cartTotals();
  // в корзине — «Оформить», на других вкладках при непустой корзине — «Корзина · сумма»
  if (n > 0 && tab !== 'orders' && tab !== 'admin') {
    const text = tab === 'checkout' ? `Оплатить · ${rub(coTotal())}` : tab === 'cart' ? L.checkout(rub(sum)) : `🛒 ${L.tCart} · ${rub(sum)}`;
    tg.MainButton.setParams({ text, color: '#e8590c', text_color: '#ffffff' });
    tg.MainButton.show();
  } else tg.MainButton.hide();
}
function refresh(id) {
  document.querySelectorAll(`[data-ctrl="${id}"]`).forEach(el => { el.innerHTML = ctrl(byId(id)); });
  if (openId == id) renderSheet();
  renderCart();
}
async function change(id, delta) {
  const p = byId(id); if (!p) return;
  const q = Math.max(0, (cart[id] || 0) + delta);
  if (q > p.stock) { toast(L.noMore); return; }
  const prev = cart[id] || 0;
  if (q) cart[id] = q; else delete cart[id];
  haptic(delta > 0 ? 'medium' : 'light');
  refresh(id);
  try { await api('/cart', { product_id: id, qty: q }); }
  catch (e) { if (prev) cart[id] = prev; else delete cart[id]; refresh(id); toast(e.message); }
}
async function checkout() {
  if (!cartTotals().n) { toast(L.cartEmpty); return; }
  try {
    tg?.MainButton?.showProgress?.();
    await api('/checkout', {});
    if (inTg) tg.close(); else toast('✓');
  } catch (e) { toast(e.message); } finally { tg?.MainButton?.hideProgress?.(); }
}

/* ---------- заказы ---------- */
async function loadOrders() {
  $('v-orders').innerHTML = `<h1>${L.ordersTitle}</h1><div class="skel" style="aspect-ratio:3/1"></div>`;
  try { orders = (await api('/orders')).orders; } catch (e) { $('v-orders').innerHTML = `<h1>${L.ordersTitle}</h1><div class="empty">${esc(e.message)}</div>`; return; }
  $('v-orders').innerHTML = `<h1>${L.ordersTitle}</h1>` + (orders.length ? orders.map(o => `
    <div class="order">
      <div class="top"><span class="code">№ ${esc(o.code)}</span><span class="pill ${esc(o.status)}">${esc(o.statusLabel)}</span></div>
      ${o.step >= 0 ? `<div class="steps">${(lang === 'en' ? ['Paid', 'Packing', o.pickup ? 'Ready' : 'Shipped', o.pickup ? 'Picked up' : 'Delivered'] : ['Оплачен', 'Собираем', o.pickup ? 'Готов' : 'Отправлен', o.pickup ? 'Получен' : 'Доставлен'])
        .map((n, i) => `<div class="${i < o.step || o.step === 3 ? 'done' : i === o.step ? 'now' : ''}">${n}</div>`).join('')}</div>` : ''}
      <ul>${o.items.map(i => `<li><span>${esc(i.name)} × ${i.qty}</span><span>${rub(i.price * i.qty)}</span></li>`).join('')}
        ${o.delivery_cost ? `<li><span>${L.delivery}</span><span>${rub(o.delivery_cost)}</span></li>` : ''}</ul>
      <div class="sum"><span>${L.total}</span><span>${rub(o.total)}</span></div>
      <div class="meta">${esc(when(o.created_at))}${o.address ? ' · ' + esc(o.address) : ''}</div>
      ${o.track ? `<div class="track">🚚 ${lang === 'en' ? 'Tracking' : 'Трек-номер'}: <b>${esc(o.track)}</b></div>` : ''}
      ${o.rating ? `<div class="stars">${'★'.repeat(o.rating)}${'☆'.repeat(5 - o.rating)}</div>` : ''}
      ${o.can_pay ? `<button class="btn pay" data-payorder="${o.id}">💳 Оплатить ${rub(o.total)}</button>` : ''}
    </div>`).join('') : `<div class="empty"><b>📦</b>${L.ordersEmpty}</div>`);
}

/* ---------- AI-подбор ---------- */
async function aiAsk() {
  const query = $('aiQ').value.trim(); if (!query) { $('aiQ').focus(); return; }
  $('aiGo').disabled = true; $('aiGo').innerHTML = `<span class="dots">${L.aiWait}</span>`;
  $('aiAdvice').textContent = ''; $('aiGrid').innerHTML = '';
  try {
    const d = await api('/ai', { query }, 1);
    $('aiAdvice').textContent = d.advice || '';
    const list = (d.ids || []).map(byId).filter(Boolean);
    $('aiGrid').innerHTML = list.length ? list.map(cardHtml).join('') : `<div class="empty">${L.aiNone}</div>`;
  } catch (e) { toast(e.message); }
  finally { $('aiGo').disabled = false; $('aiGo').textContent = L.aiGo; }
}

/* ---------- карточка товара ---------- */
let openId = null;
function renderSheet() {
  const p = byId(openId); if (!p) return;
  const stock = p.stock > 0 ? `<div class="stock" style="color:var(--ok)">✓ ${L.inStock(p.stock)}</div>` : `<div class="stock" style="color:var(--bad)">${L.out}</div>`;
  const q = cart[p.id] || 0;
  const act = p.stock <= 0 ? '' : q
    ? `<div class="step"><button data-dec="${p.id}">−</button><span>${q}</span><button data-add="${p.id}">+</button></div>`
    : `<button class="add" data-add="${p.id}">${L.addBtn}</button>`;
  $('sheet').innerHTML = `<button class="x" data-close>✕</button>
    <div class="big">${photo(p)}</div>
    <div class="body">
      ${ct(p) ? `<div class="cat">${esc(ct(p))}</div>` : ''}
      <h2>${esc(nm(p))}</h2>
      ${ds(p) ? `<p>${esc(ds(p))}</p>` : ''}
      ${stock}
      <div class="act"><div class="price">${rub(p.price)}</div>${act}</div>
    </div>`;
}
function openSheet(id) { openId = id; renderSheet(); document.body.classList.add('open'); tg?.BackButton?.show(); }
function closeSheet() { openId = null; document.body.classList.remove('open'); if (tab === 'catalog') tg?.BackButton?.hide(); }

/* ---------- вкладки ---------- */
function go(t) {
  tab = t;
  document.querySelectorAll('section.view').forEach(s => s.classList.toggle('on', s.id === 'v-' + t));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === (t === 'checkout' ? 'cart' : t)));
  if (t === 'orders') loadOrders();
  if (t === 'admin') loadAdmin();
  if (t === 'cart') renderCart();
  if (t === 'catalog') tg?.BackButton?.hide(); else tg?.BackButton?.show();
  mainButton();
  scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-add],[data-dec],[data-open],[data-close],[data-c],[data-tab],[data-lang],[data-hint],[data-checkout],[data-retry]');
  if (!t) return;
  const d = t.dataset;
  if (d.add) { e.stopPropagation(); change(+d.add, 1); }
  else if (d.dec) { e.stopPropagation(); change(+d.dec, -1); }
  else if (d.c !== undefined) { cat = d.c || null; renderChips(); renderGrid(); }
  else if (d.close !== undefined) closeSheet();
  else if (d.open) openSheet(+d.open);
  else if (d.tab) go(d.tab);
  else if (d.hint) { $('aiQ').value = d.hint; aiAsk(); }
  else if (d.checkout !== undefined) openCheckout();
  else if (d.retry !== undefined) load();
  else if (d.lang && d.lang !== lang) {
    lang = d.lang; applyLang(); renderChips(); renderGrid(); renderCart();
    if (tab === 'orders') loadOrders();
    api('/lang', { lang }).catch(() => {});
  }
});
$('veil').onclick = closeSheet;
$('q').oninput = e => { query = e.target.value; renderGrid(); };
$('aiGo').onclick = aiAsk;
tg?.MainButton?.onClick(() => (tab === 'checkout' ? pay() : tab === 'cart' ? openCheckout() : go('cart')));
tg?.BackButton?.onClick(() => (document.body.classList.contains('open') ? closeSheet() : tab === 'checkout' ? go('cart') : tab === 'admin' && admMode === 'chats' && chatOpen ? (chatOpen = null, loadAdmin()) : go('catalog')));


/* ---------- админка (только владелица) ---------- */
let isOwner = false, unread = 0, admMode = 'orders', admProducts = [], admOrders = [], editId = null;
let ordFilter = 'active', statsDays = 30, chatOpen = null, chatTimer = null, admSettings = null;
const ST = { awaiting_payment: '⏳ Ждёт оплату', pending: '⏳ Ждёт оплату', paid: '🆕 Новый', assembling: '📦 Собираем', shipped: '🚚 Отправлен', delivered: '✅ Доставлен', cancelled: '❌ Отменён' };
const stLabel = o => o.status === 'shipped' && o.pickup ? '🏠 Готов к выдаче' : (ST[o.status] || o.status);
const FILTERS = [
  ['active', 'В работе', o => ['paid', 'assembling', 'shipped'].includes(o.status)],
  ['unpaid', 'Ждут оплату', o => o.status === 'awaiting_payment' || o.status === 'pending'],
  ['delivered', 'Доставлены', o => o.status === 'delivered'],
  ['cancelled', 'Отменены', o => o.status === 'cancelled'],
  ['all', 'Все', () => true],
];
const ADM = [['orders', '📦 Заказы'], ['stats', '📊 Статистика'], ['products', '🛍 Товары'], ['chats', '💬 Чаты'], ['settings', '⚙️ Настройки']];
function ask(q) { return new Promise(ok => (tg?.showConfirm ? tg.showConfirm(q, ok) : ok(confirm(q)))); }
function setUnread(n) { unread = n || 0; const b = $('admBadge'); if (b) b.textContent = unread || ''; const c = document.querySelector('[data-adm="chats"] em'); if (c) c.textContent = unread || ''; }

function admNav() {
  return `<div class="chips adm">${ADM.map(([k, l]) => `<button class="chip ${admMode === k ? 'on' : ''}" data-adm="${k}">${l}${k === 'chats' ? `<em>${unread || ''}</em>` : ''}</button>`).join('')}</div>`;
}
async function loadAdmin() {
  stopChatPoll();
  const v = $('v-admin');
  v.innerHTML = `<h1>Админка</h1>${admNav()}<div id="admBody"><div class="skel" style="aspect-ratio:3/1"></div></div>`;
  document.querySelector('.chips.adm .on')?.scrollIntoView({ inline: 'center', block: 'nearest' });
  try {
    if (admMode === 'products') { admProducts = (await api('/admin/products')).products; renderAdmProducts(); }
    else if (admMode === 'orders') { admOrders = (await api('/admin/orders')).orders; renderAdmOrders(); }
    else if (admMode === 'stats') await loadStats();
    else if (admMode === 'chats') chatOpen ? await openChat(chatOpen) : await loadChats();
    else if (admMode === 'settings') { admSettings = await api('/admin/settings'); renderSettings(); }
  } catch (e) { $('admBody').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

/* — товары — */
function renderAdmProducts() {
  const noPhoto = admProducts.filter(p => !p.has_photo).length;
  $('admBody').innerHTML = `<div style="display:flex;gap:8px;margin-bottom:12px"><button class="btn" data-edit="new" style="flex:2">＋ Новый товар</button><button class="btn ghost" data-backup style="flex:1">📦 Копия</button></div>` +
    (noPhoto ? `<div class="note" style="margin:0 0 10px">Без фото: ${noPhoto} — нажмите на товар и «📷 Фото»</div>` : '') +
    admProducts.map(p => `
    <div class="aline" data-edit="${p.id}">
      <div class="thumb">${photo(p)}</div>
      <div class="mid"><div class="t">${esc(p.name)}</div>
        <div class="s">${rub(p.price)} · ${p.stock > 0 ? (p.stock <= 3 ? `<span class="warn">осталось ${p.stock}</span>` : `${p.stock} шт.`) : '<span class="warn">нет в наличии</span>'}${p.category ? ' · ' + esc(p.category) : ''}${p.has_photo ? '' : ' · <span class="warn">без фото</span>'}</div></div>
      <span style="color:var(--muted)">›</span>
    </div>`).join('');
}
function openEditor(id) {
  editId = id;
  const p = id === 'new' ? { name: '', price: '', stock: 1, category: '', description: '' } : admProducts.find(x => x.id == id);
  if (!p) return;
  const f = (k, label, type = 'text', extra = '') => `<label>${label}</label><input name="${k}" type="${type}" value="${esc(k === 'price' && p.price ? Math.round(p.price / 100) : p[k] ?? '')}" ${extra}>`;
  $('sheet').innerHTML = `<button class="x" data-close>✕</button>
    ${id === 'new' ? '' : `<div class="big photoEdit">${photo(p)}<button class="up" data-photo="${p.id}">📷 ${p.has_photo ? 'Заменить фото' : 'Добавить фото'}</button></div>`}
    <form class="body form" id="pform" onsubmit="return false">
      <h2>${id === 'new' ? 'Новый товар' : 'Редактирование'}</h2>
      ${id === 'new' ? '' : `<details><summary>Фото по ссылке</summary><div style="display:flex;gap:8px;margin-top:8px"><input id="photoUrl" placeholder="https://…" inputmode="url"><button class="btn" style="width:auto;padding:0 16px" data-purl="${p.id}">OK</button></div></details>`}
      ${f('name', 'Название')}
      <div class="two"><div>${f('price', 'Цена, ₽', 'number', 'inputmode="numeric" min="1"')}</div><div>${f('stock', 'Остаток, шт.', 'number', 'inputmode="numeric" min="0"')}</div></div>
      ${f('category', 'Категория', 'text', 'list="cats"')}
      <datalist id="cats">${[...new Set(admProducts.map(x => x.category).filter(Boolean))].map(c => `<option value="${esc(c)}">`).join('')}</datalist>
      <label>Описание</label><textarea name="description">${esc(p.description || '')}</textarea>
      <details><summary>English (необязательно)</summary>
        ${f('name_en', 'Name')}${f('category_en', 'Category')}<label>Description</label><textarea name="description_en">${esc(p.description_en || '')}</textarea>
      </details>
      <div class="actions">${id === 'new' ? '' : `<button class="btn danger" data-del="${p.id}" style="flex:1">Удалить</button>`}<button class="btn" data-save style="flex:2">${id === 'new' ? 'Создать' : 'Сохранить'}</button></div>
      ${id === 'new' ? '<div class="note">Фото можно добавить сразу после создания</div>' : ''}
    </form>`;

/* — заказы — */
function nextStep(o) {
  if (o.status === 'awaiting_payment' || o.status === 'pending') return ['paid', '✅ Оплачен (вручную)'];
  if (o.status === 'paid') return ['assembling', '📦 Начать сборку'];
  if (o.status === 'assembling') return ['shipped', o.pickup ? '🏠 Готов к выдаче' : '🚚 Отправить'];
  if (o.status === 'shipped') return ['delivered', o.pickup ? '✅ Выдан' : '✅ Доставлен'];
  if (o.status === 'cancelled') return ['paid', o.was_paid ? '↩️ Вернуть в работу' : '✅ Оплачен (вручную)'];
  return null;
}
function orderCard(o) {
  const ns = nextStep(o);
  const extra = [
    o.promo ? `🎟 ${esc(o.promo)} −${o.discount}%` : '',
    o.track ? `🚚 Трек: <b>${esc(o.track)}</b>` : '',
    o.rating ? `${'★'.repeat(o.rating)}${'☆'.repeat(5 - o.rating)}` : '',
  ].filter(Boolean).join(' · ');
  return `
    <div class="order" id="ord-${o.id}">
      <div class="top"><span class="code">№ ${esc(o.code)}${o.buyer ? ' · ' + esc(o.buyer) : ''}</span><span class="pill ${esc(o.status)}">${esc(stLabel(o))}</span></div>
      <ul>${o.items.map(i => `<li><span>${esc(i.name)} × ${i.qty}</span><span>${rub(i.price * i.qty)}</span></li>`).join('')}
        ${o.pickup ? '' : `<li><span>Доставка</span><span>${o.delivery_cost ? rub(o.delivery_cost) : 'бесплатно'}</span></li>`}</ul>
      <div class="sum"><span>Итого</span><span>${rub(o.total)}</span></div>
      <div class="meta">${esc(when(o.created_at))} · ${o.pickup ? '🏠 Самовывоз' : '📍 ' + esc(o.address)}</div>
      ${extra ? `<div class="meta">${extra}</div>` : ''}
      <div class="contact">${o.phone ? `<a class="mini" href="tel:${esc(o.phone.replace(/[^\d+]/g, ''))}">📞 ${esc(o.phone)}</a>` : ''}<button class="mini" data-chatwith="${o.chat_id}">💬 Написать</button></div>
      <div class="oact">${ns ? `<button class="btn" data-ost="${o.id}:${ns[0]}">${ns[1]}</button>` : ''}
        ${!['cancelled', 'delivered'].includes(o.status) ? `<button class="btn ghost small" data-ost="${o.id}:cancelled">Отменить</button>` : ''}
        ${o.status === 'shipped' && !o.pickup ? `<button class="btn ghost small" data-track="${o.id}">Трек</button>` : ''}</div>
    </div>`;
}
function renderAdmOrders() {
  const cnt = k => admOrders.filter(FILTERS.find(f => f[0] === k)[2]).length;
  const f = FILTERS.find(x => x[0] === ordFilter) || FILTERS[0];
  const list = admOrders.filter(f[2]);
  $('admBody').innerHTML = `<div class="chips small">${FILTERS.map(([k, l]) => `<button class="chip ${ordFilter === k ? 'on' : ''}" data-of="${k}">${l}${k !== 'all' && cnt(k) ? ` · ${cnt(k)}` : ''}</button>`).join('')}</div>` +
    (list.length ? list.map(orderCard).join('') : `<div class="empty"><b>📦</b>${ordFilter === 'active' ? 'Сейчас нет заказов в работе' : 'Здесь пока пусто'}</div>`);

function trackSheet(id, then) {
  const o = admOrders.find(x => x.id == id);
  $('sheet').innerHTML = `<button class="x" data-close>✕</button>
    <div class="body form" style="padding-top:24px"><h2>Заказ № ${esc(o?.code || id)} отправлен 🚚</h2>

async function setOrderStatus(id, st, track, skipSheet) {
  const o = admOrders.find(x => x.id == id);

const coCost = () => {
  if (co.delivery === 'pickup' || !coInfo || coFree()) return 0;
  const n = s => String(s || '').trim().toLowerCase().replace(/ё/g, 'е').replace(/\s+/g, ' ');
  // «Другой город», но вписали город из списка (например «москва») — берём его тариф, как и сервер
  const want = co.city === '__other' ? n(co.other) : n(co.city);
  const c = coInfo.cities.find(x => n(x.city) === want || (x.city_en && n(x.city_en) === want));
  return c ? c.price : (co.city === '__other' ? coInfo.otherPrice : 0);
};
async function openCheckout() {
  if (!cartTotals().n) { toast(L.cartEmpty); return; }
  go('checkout');
  if (!coInfo) {
    $('v-checkout').innerHTML = `<h1>Оформление</h1><div class="skel" style="aspect-ratio:3/1"></div>`;
    try { coInfo = await api('/checkout-info'); } catch (e) { $('v-checkout').innerHTML = `<h1>Оформление</h1><div class="empty">${esc(e.message)}</div>`; return; }
    if (!co.city && coInfo.cities.length) co.city = (coInfo.cities.find(c => /петербург/i.test(c.city)) || coInfo.cities[0]).city;
    if (!co.city) co.city = '__other';
    if (!coInfo.pickup) co.delivery = 'city';
  }
  renderCheckout();
}
function renderCheckout() {
  const { sum } = cartTotals();
  const disc = co.promoPct ? Math.round(sum * co.promoPct / 100) : 0;
  const dcost = coCost();
  const total = sum - disc + dcost;
  const cityName = c => (lang === 'en' && c.city_en) || c.city;
  $('v-checkout').innerHTML = `<h1>Оформление</h1>
    <div class="box"><h3>Получение</h3>
      ${coInfo.pickup ? `<div class="seg"><button data-dl="city" class="${co.delivery === 'city' ? 'on' : ''}">🚚 Доставка</button><button data-dl="pickup" class="${co.delivery === 'pickup' ? 'on' : ''}">🏠 Самовывоз</button></div>` : ''}
      ${co.delivery === 'city' && coInfo.freeFrom > 0 ? `<div class="note" style="text-align:left;margin:0 0 6px">${coFree() ? '🎉 Доставка бесплатно!' : `Бесплатная доставка от ${rub(coInfo.freeFrom)} — осталось ${rub(coInfo.freeFrom - coGoods())}`}</div>` : ''}
      ${co.delivery === 'city' ? `
        <div class="fld"><select id="coCity">${coInfo.cities.map(c => `<option value="${esc(c.city)}" ${co.city === c.city ? 'selected' : ''}>${esc(cityName(c))} — ${rub(c.price)}</option>`).join('')}
          <option value="__other" ${co.city === '__other' ? 'selected' : ''}>Другой город — ${rub(coInfo.otherPrice)}</option></select></div>
        ${co.city === '__other' ? `<div class="fld"><input id="coOther" placeholder="Город" value="${esc(co.other)}"></div>` : ''}
        <div class="fld"><textarea id="coAddr" placeholder="Улица, дом, квартира, подъезд">${esc(co.address)}</textarea></div>` : `<div class="note" style="text-align:left;margin-top:10px">${coInfo.pickupAddress ? '📍 ' + esc(coInfo.pickupAddress) + '<br>' : ''}Напишем в чат, когда заказ будет готов к выдаче.</div>`}
      <div class="fld"><input id="coPhone" type="tel" inputmode="tel" placeholder="Телефон для связи" value="${esc(co.phone)}"></div>
    </div>
    <div class="box"><h3>Промокод</h3>
      <div class="promo"><input id="coPromo" placeholder="Если есть" value="${esc(co.promo)}" autocapitalize="characters"><button class="btn ghost" data-promo>Применить</button></div>
      ${co.promoOk ? `<div class="fld ok">✓ ${esc(co.promoOk)}</div>` : ''}
    </div>
    <div class="box">
      <div class="sumrow"><span>Товары</span><span>${rub(sum)}</span></div>
      ${disc ? `<div class="sumrow"><span>Скидка ${co.promoPct}%</span><span>−${rub(disc)}</span></div>` : ''}
      <div class="sumrow"><span>Доставка</span><span>${co.delivery === 'pickup' || coFree() ? 'бесплатно' : rub(dcost)}</span></div>
      <div class="sumrow big"><span>Итого</span><span>${rub(total)}</span></div>
    </div>
    ${inTg ? '' : `<button class="btn" data-pay>Оплатить · ${rub(total)}</button>`}
    <div class="note">${L.checkoutNote}</div>`;
  const bind = (id, k, rerender) => { const el = $(id); if (el) el[el.tagName === 'SELECT' ? 'onchange' : 'oninput'] = e => { co[k] = e.target.value; if (rerender) renderCheckout(); else mainButton(); }; };
  bind('coCity', 'city', true); bind('coOther', 'other'); if ($('coOther')) $('coOther').onchange = () => renderCheckout(); bind('coAddr', 'address'); bind('coPhone', 'phone'); bind('coPromo', 'promo');
  mainButton();
}
function coTotal() { return coGoods() + coCost(); }
async function applyPromo() {
  co.promo = ($('coPromo')?.value || '').trim();
  if (!co.promo) { co.promoPct = 0; co.promoOk = ''; renderCheckout(); return; }
  try { const d = await api('/promo', { code: co.promo }, 1); co.promoPct = d.percent; co.promoOk = `Скидка ${d.percent}%`; haptic('medium'); }
  catch (e) { co.promoPct = 0; co.promoOk = ''; toast(e.message); }
  renderCheckout();
}
let paying = false;
async function pay() {
  if (paying) return;
  if (co.delivery === 'city') {
    if (co.city === '__other' && co.other.trim().length < 2) { toast('Укажите город'); $('coOther')?.focus(); return; }
    if (co.address.trim().length < 5) { toast('Укажите адрес доставки'); $('coAddr')?.focus(); return; }
  }
  if (co.promo && !co.promoPct) { await applyPromo(); if (!co.promoPct) return; }
  paying = true; tg?.MainButton?.showProgress?.();
  try {
    const d = await api('/order', { delivery: co.delivery === 'pickup' ? 'pickup' : 'city', city: co.city === '__other' ? co.other.trim() : co.city,
      address: co.address, phone: co.phone, promo: co.promoPct ? co.promo : '' }, 1);
    haptic('heavy');
    cart = {}; renderCart(); renderGrid();
    co.promo = ''; co.promoPct = 0; co.promoOk = '';
    if (tg?.openLink) tg.openLink(d.pay_url); else window.open(d.pay_url, '_blank');
    go('orders');
    toast(`Заказ ${d.code} создан — осталось оплатить 💳`);
  } catch (e) { toast(e.message); }
  finally { paying = false; tg?.MainButton?.hideProgress?.(); }
}
async function payOrder(id) {
  try { const d = await api(`/orders/${id}/pay`, {}, 1); if (tg?.openLink) tg.openLink(d.pay_url); else window.open(d.pay_url, '_blank'); }
  catch (e) { toast(e.message); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-dl],[data-promo],[data-pay],[data-payorder]');
  if (!t) return;
  const d = t.dataset;
  if (d.dl) { co.delivery = d.dl; renderCheckout(); }
  else if (d.promo !== undefined) applyPromo();
  else if (d.pay !== undefined) pay();
  else if (d.payorder) payOrder(+d.payorder);
});

let startTabDone = false;
async function load() {
  $('grid').innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>';
  try {
    const d = await api('/catalog');
    lang = d.lang === 'en' ? 'en' : 'ru'; applyLang();
    products = d.products; cart = d.cart || {};
    isOwner = Boolean(d.isOwner);
    $('adminTab').hidden = !isOwner; $('tabs').classList.toggle('five', isOwner);
    if (isOwner) setUnread(d.unread);
    renderChips(); renderGrid(); renderCart();
    const qs = new URLSearchParams(location.search), want = qs.get('tab');
    if (isOwner && want === 'admin' && ADM.some(a => a[0] === qs.get('adm'))) { admMode = qs.get('adm'); chatOpen = +qs.get('chat') || null; }
    if (!startTabDone && ['cart', 'orders', 'ai'].concat(isOwner ? ['admin'] : []).includes(want)) go(want);
    startTabDone = true;
  } catch (e) {
    $('grid').innerHTML = `<div class="empty"><b>😕</b>${esc(e.message)}${e.fatal ? '' : `<br><br><button class="btn ghost" data-retry>${L.retry}</button>`}</div>`;
  }
}
applyLang();
load();
</script>
</body>
</html>
